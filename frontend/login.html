<body
    class="bg-background font-body-md text-on-surface antialiased min-h-screen flex flex-col justify-center items-center">
    <main class="w-full flex-1 flex flex-col items-center justify-center p-4 md:p-8">
        <div class="flex flex-col w-full items-center justify-center py-6 px-4 md:px-8">
            <div class="w-full max-w-[440px] flex flex-col items-center">
                <!-- Top Brand Emblem & Community Tag -->
                <div class="flex flex-col items-center mb-6 text-center">
                    <!-- <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuBK6c2mshHsWi2470DSZjLRGjxJCr9ki8cekUEC1okvOmMt7ykjhP_TmaGHHkFMtBOoRn3gbCd1kJQnC8sJedzV_Z_s0r6VqOVhLhtG2gpruUXzihvKcxod9sCJtOEg7IaByHtAod8LNg6WQQ_jMcxYpqVUHMsUZM_ZNPiDBEx_xfhhURt3aK80HTWZ7mgE3PEx8TrFKA9aqmDSlHaDeAiqzU3gFfV4lXiHC_J4loYiPjwPtEii1luz"
                        alt="Ink &amp; Thought Logo"
                        class="h-10 w-auto mb-3 duration-200 transition-transform hover:scale-105"
                        style="object-fit: contain;"> -->
                        <!-- Logo of ink & Thought -->
                    <img src="assets/logo.png" alt="Ink &amp; Thought Logo"
                        class="h-10 w-auto mb-3 duration-200 transition-transform hover:scale-105"
                        style="object-fit: contain;">
                    <div
                        class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-leaf-vibrant/10 text-primary font-label-sm text-xs font-semibold tracking-wide uppercase border border-leaf-vibrant/20">
                        <span class="w-1.5 h-1.5 rounded-full bg-terminal-accent animate-pulse"></span>
                        FOSS Community Publishing
                    </div>
                </div>
                <!-- Main Card -->
                <div
                    class="w-full bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 p-6 sm:p-8 relative">
                    <!-- Card Header -->
                    <div class="text-center mb-6">
                        <h1 class="font-headline-md font-semibold text-2xl text-on-surface tracking-tight">
                            Welcome Back to Ink &amp; Thought
                        </h1>
                        <p class="font-body-sm text-sm text-on-surface-variant mt-1.5 leading-relaxed">
                            Sign in to access your curated dispatches, bookmarks, and draft stories.
                        </p>
                    </div>
                    <!-- Form Elements -->
                    <form class="space-y-4" id="login-form" onsubmit="event.preventDefault(); handleLoginSubmit();">
                        <!-- Username / Email Field -->
                        <div class="flex flex-col text-left">
                            <label
                                class="font-body-sm text-sm font-medium text-on-surface mb-1.5 flex items-center justify-between"
                                for="identity">
                                <span class="">Username or Email</span>
                                <span class="font-label-sm text-[11px] text-outline font-normal">UID or RFC-822</span>
                            </label>
                            <div class="relative">
                                <div
                                    class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                                    <span class="material-symbols-outlined text-[18px]">person</span>
                                </div>
                                <input autocomplete="username"
                                    class="w-full pl-9 pr-3 py-2 bg-surface-container-low font-body-sm text-sm text-on-surface rounded-lg border border-transparent placeholder:text-outline focus:bg-surface-container-lowest focus:border-leaf-vibrant focus:outline-none focus:ring-2 focus:ring-leaf-vibrant/25 transition-all duration-150"
                                    id="identity" name="identity" placeholder="e.g. torvalds or elena@studiojournal.io"
                                    required="" type="text">
                            </div>
                        </div>
                        <!-- Password Field -->
                        <div class="flex flex-col text-left">
                            <div class="flex items-center justify-between mb-1.5">
                                <label class="font-body-sm text-sm font-medium text-on-surface"
                                    for="auth-password">Password</label>
                                <a class="font-label-sm text-xs font-medium text-primary hover:text-leaf-vibrant transition-colors hover:underline"
                                    href="#" style="color: rgb(37, 162, 68);">Forgot Password?</a>
                            </div>
                            <div class="relative">
                                <div
                                    class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                                    <span class="material-symbols-outlined text-[18px]">key</span>
                                </div>
                                <input autocomplete="current-password"
                                    class="w-full pl-9 pr-10 py-2 bg-surface-container-low font-body-sm text-sm text-on-surface rounded-lg border border-transparent placeholder:text-outline focus:bg-surface-container-lowest focus:border-leaf-vibrant focus:outline-none focus:ring-2 focus:ring-leaf-vibrant/25 transition-all duration-150"
                                    id="auth-password" name="password" placeholder="••••••••••••" required=""
                                    type="password">
                                <button aria-label="Toggle password visibility"
                                    class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors focus:outline-none"
                                    id="toggle-password-btn" onclick="togglePasswordVisibility()" type="button">
                                    <span class="material-symbols-outlined text-[18px]" id="pwd-icon">visibility</span>
                                </button>
                            </div>
                        </div>
                        <!-- Auxiliary: Remember Me -->
                        <div class="flex items-center justify-between pt-1">
                            <label class="flex items-center gap-2 cursor-pointer select-none">
                                <input
                                    class="w-4 h-4 rounded text-primary focus:ring-leaf-vibrant focus:ring-offset-0 border-outline-variant cursor-pointer accent-[#25A244]"
                                    id="remember-me" type="checkbox">
                                <span class="font-body-sm text-xs text-on-surface-variant">Stay logged in for 30
                                    days</span>
                            </label>
                            <span class="font-label-sm text-xs text-outline flex items-center gap-1">
                                <span class="material-symbols-outlined text-[14px]">lock</span>
                                256-bit
                            </span>
                        </div>
                        <!-- Submit Button -->
                        <button
                            class="w-full py-2.5 px-4 mt-2 bg-primary hover:bg-[#1e8437] text-white font-body-sm text-sm font-semibold rounded-lg shadow-sm flex items-center justify-center gap-2 transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-leaf-vibrant focus:ring-offset-1 active:scale-[0.99]"
                            id="submit-btn" type="submit" style="background-color: rgb(37, 162, 68);">
                            <span class="">Sign In to Terminal</span>
                            <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                        </button>
                    </form>
                    <!-- Divider -->
                    <div class="relative my-6 flex items-center justify-center">
                        <div class="w-full bg-outline-variant/30 h-[1px]"></div>
                        <span
                            class="absolute bg-surface-container-lowest px-3 font-label-sm text-xs text-outline uppercase tracking-wider">
                            Or continue with
                        </span>
                    </div>
                    <!-- Developer Authentication Methods -->
                    <div class="grid grid-cols-3 gap-2 sm:gap-3">
                        <!-- GitHub Provider Button -->
                        <button
                            class="flex items-center justify-center gap-1.5 py-2 px-2.5 bg-surface-container-low hover:bg-surface-container text-on-surface font-body-sm text-sm rounded-lg transition-colors border border-outline-variant/20 focus:outline-none focus:ring-2 focus:ring-leaf-vibrant/25"
                            onclick="handleOAuth('GitHub')" type="button">
                            <svg class="w-4 h-4 fill-current shrink-0" viewBox="0 0 24 24">
                                <path clip-rule="evenodd"
                                    d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
                                    fill-rule="evenodd"></path>
                            </svg>
                            <span class="font-medium text-xs sm:text-sm">GitHub</span>
                        </button>
                        <!-- GitLab Provider Button -->
                        <button
                            class="flex items-center justify-center gap-1.5 py-2 px-2.5 bg-surface-container-low hover:bg-surface-container text-on-surface font-body-sm text-sm rounded-lg transition-colors border border-outline-variant/20 focus:outline-none focus:ring-2 focus:ring-leaf-vibrant/25"
                            onclick="handleOAuth('GitLab')" type="button">
                            <svg class="w-4 h-4 fill-current shrink-0" viewBox="0 0 24 24">
                                <path
                                    d="M22.65 14.39L20.6 8.08c-.13-.41-.65-.56-.99-.29l-1.85 1.48-3.79-11.66c-.14-.44-.72-.44-.86 0L9.32 9.27 7.47 7.79c-.34-.27-.86-.12-.99.29L4.43 14.39c-.1.3.01.63.26.82l8.35 6.27c.27.2.65.2.92 0l8.43-6.27c.25-.19.36-.52.26-.82z">
                                </path>
                            </svg>
                            <span class="font-medium text-xs sm:text-sm">GitLab</span>
                        </button>
                        <!-- Google Provider Button -->
                        <button
                            class="flex items-center justify-center gap-1.5 py-2 px-2.5 bg-surface-container-low hover:bg-surface-container text-on-surface font-body-sm text-sm rounded-lg transition-colors border border-outline-variant/20 focus:outline-none focus:ring-2 focus:ring-leaf-vibrant/25"
                            onclick="handleOAuth('Google')" type="button">
                            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24">
                                <path
                                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                                    fill="#4285F4"></path>
                                <path
                                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                                    fill="#34A853"></path>
                                <path
                                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
                                    fill="#FBBC05"></path>
                                <path
                                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
                                    fill="#EA4335"></path>
                            </svg>
                            <span class="font-medium text-xs sm:text-sm">Google</span>
                        </button>
                    </div>
                    <!-- Quick Session Notification Banner (Hidden by default) -->
                    <div class="hidden mt-4 p-3 rounded-lg bg-leaf-vibrant/10 border border-leaf-vibrant/30 text-on-surface-variant text-center font-body-sm text-xs transition-all"
                        id="status-message">
                        <span class="font-medium text-primary">Authenticating payload...</span> Redirecting to feed.
                    </div>
                </div>
                <!-- Registration Link Footer -->
                <div class="mt-5 text-center">
                    <p class="font-body-sm text-sm text-on-surface-variant">
                        Don't have an account?
                        <!-- UPDATED HREF -->
                        <a class="font-medium text-primary hover:text-leaf-vibrant hover:underline ml-1 inline-flex items-center gap-0.5"
                            href="register.html" style="color: rgb(37, 162, 68);">
                            Register here
                            <span class="material-symbols-outlined text-[14px]">north_east</span>
                        </a>
                    </p>
                </div>

            </div>
        </div>
        <script>
            function togglePasswordVisibility() {
                const pwdInput = document.getElementById('auth-password');
                const pwdIcon = document.getElementById('pwd-icon');
                if (pwdInput.type === 'password') {
                    pwdInput.type = 'text';
                    pwdIcon.textContent = 'visibility_off';
                } else {
                    pwdInput.type = 'password';
                    pwdIcon.textContent = 'visibility';
                }
            }

            // UPDATED JWT FETCH LOGIC
            async function handleLoginSubmit() {
                const usernameInput = document.getElementById('identity').value;
                const passwordInput = document.getElementById('auth-password').value;

                const banner = document.getElementById('status-message');
                const submitBtn = document.getElementById('submit-btn');

                // UI Loading state
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-75');
                banner.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'border-red-300');
                banner.classList.add('bg-leaf-vibrant/10', 'text-on-surface-variant', 'border-leaf-vibrant/30');
                banner.innerHTML = '<span class="font-medium text-primary">Authenticating payload...</span>';

                try {
                    const response = await fetch('http://127.0.0.1:8000/api/token/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            username: usernameInput,
                            password: passwordInput
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        localStorage.setItem('access_token', data.access);
                        localStorage.setItem('refresh_token', data.refresh);

                        banner.innerHTML = '<span class="font-medium text-primary">Session verified.</span> Redirecting to feed...';

                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1000);
                    } else {
                        submitBtn.disabled = false;
                        submitBtn.classList.remove('opacity-75');
                        banner.classList.remove('bg-leaf-vibrant/10', 'text-on-surface-variant', 'border-leaf-vibrant/30');
                        banner.classList.add('bg-red-100', 'text-red-700', 'border-red-300');
                        banner.innerHTML = data.detail || 'Invalid credentials provided. Please try again.';
                    }
                } catch (error) {
                    console.error('Login Error:', error);
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-75');
                    banner.classList.remove('bg-leaf-vibrant/10', 'text-on-surface-variant', 'border-leaf-vibrant/30');
                    banner.classList.add('bg-red-100', 'text-red-700', 'border-red-300');
                    banner.innerHTML = 'Unable to connect to the authentication server.';
                }
            }

            // UPDATED OAUTH LOGIC
            function handleOAuth(provider) {
                const banner = document.getElementById('status-message');
                banner.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'border-red-300');
                banner.classList.add('bg-leaf-vibrant/10', 'text-on-surface-variant', 'border-leaf-vibrant/30');
                banner.innerHTML = `Handshaking with <strong>${provider} OAuth 2.0</strong> protocol... (Not yet implemented)`;
            }
        </script>
    </main>
