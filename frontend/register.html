        <script>
            function togglePasswordVisibility(fieldId, btn) {
                const field = document.getElementById(fieldId);
                const icon = btn.querySelector('.material-symbols-outlined');
                if (field.type === 'password') {
                    field.type = 'text';
                    icon.textContent = 'visibility_off';
                } else {
                    field.type = 'password';
                    icon.textContent = 'visibility';
                }
            }

            function checkPasswordStrength(val) {
                const bar1 = document.getElementById('bar-1');
                const bar2 = document.getElementById('bar-2');
                const bar3 = document.getElementById('bar-3');
                const bar4 = document.getElementById('bar-4');
                const label = document.getElementById('strength-label');

                const hasLength = val.length >= 8;
                const hasNum = /\d/.test(val);
                const hasSpecial = /[^A-Za-z0-9]/.test(val);
                const hasCase = /[a-z]/.test(val) && /[A-Z]/.test(val);

                let score = 0;
                if (hasLength) score++;
                if (hasNum) score++;
                if (hasSpecial) score++;
                if (hasCase) score++;

                const resetBars = () => {
                    [bar1, bar2, bar3, bar4].forEach(b => {
                        b.className = 'h-1 rounded-full bg-surface-container-high transition-colors duration-200';
                    });
                };

                resetBars();

                if (val.length === 0) {
                    label.textContent = 'min. 8 characters';
                    label.className = 'font-label-sm text-label-sm text-on-surface-variant';
                    return;
                }

                if (score <= 1) {
                    bar1.className = 'h-1 rounded-full bg-error transition-colors duration-200';
                    label.textContent = 'weak entropy';
                    label.className = 'font-label-sm text-label-sm text-error';
                } else if (score === 2) {
                    bar1.className = 'h-1 rounded-full bg-[#FEA619] transition-colors duration-200';
                    bar2.className = 'h-1 rounded-full bg-[#FEA619] transition-colors duration-200';
                    label.textContent = 'fair entropy';
                    label.className = 'font-label-sm text-label-sm text-[#F59E0B] font-medium';
                } else if (score === 3) {
                    bar1.className = 'h-1 rounded-full bg-[#57B952] transition-colors duration-200';
                    bar2.className = 'h-1 rounded-full bg-[#57B952] transition-colors duration-200';
                    bar3.className = 'h-1 rounded-full bg-[#57B952] transition-colors duration-200';
                    label.textContent = 'good entropy';
                    label.className = 'font-label-sm text-label-sm text-[#006b25] font-medium';
                } else {
                    [bar1, bar2, bar3, bar4].forEach(b => {
                        b.className = 'h-1 rounded-full bg-leaf-vibrant transition-colors duration-200';
                    });
                    label.textContent = 'strong entropy';
                    label.className = 'font-label-sm text-label-sm text-primary font-semibold';
                }
            }

            function checkPasswordMatch() {
                const pwd = document.getElementById('password').value;
                const confirm = document.getElementById('confirm-password').value;
                const hint = document.getElementById('match-hint');

                if (!confirm) {
                    hint.classList.add('hidden');
                    return;
                }

                hint.classList.remove('hidden');
                if (pwd === confirm) {
                    hint.textContent = 'Passwords match seamlessly';
                    hint.className = 'font-label-sm text-label-sm text-[#006b25] mt-1';
                } else {
                    hint.textContent = 'Passwords do not match';
                    hint.className = 'font-label-sm text-label-sm text-error mt-1';
                }
            }

            // UPDATED JWT REGISTRATION FETCH LOGIC
            async function handleRegistration() {
                const username = document.getElementById('username').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm-password').value;

                const banner = document.getElementById('status-message');
                const btn = document.getElementById('submit-btn');

                // Basic frontend validation to stop submission if passwords don't match
                if (password !== confirmPassword) {
                    banner.classList.remove('hidden', 'bg-leaf-vibrant/10', 'text-primary');
                    banner.classList.add('bg-red-100', 'text-red-700', 'border', 'border-red-300');
                    banner.innerHTML = 'Validation Error: Passwords do not match.';
                    return;
                }

                const originalText = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = `
      <span class="inline-block w-4 h-4 border-2 border-on-primary border-t-transparent rounded-full animate-spin"></span>
      <span>Generating Cryptographic Keys...</span>
    `;

                try {
                    // Adjust this endpoint URL to match your Django user registration view
                    const response = await fetch('http://127.0.0.1:8000/api/register/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            username: username,
                            email: email,
                            password: password
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        banner.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'border-red-300');
                        banner.classList.add('bg-leaf-vibrant/10', 'text-on-surface-variant', 'border', 'border-leaf-vibrant/30');
                        btn.innerHTML = `
              <span class="material-symbols-outlined text-[18px]">done</span>
              <span>Account Provisioned!</span>
            `;
                        banner.innerHTML = '<span class="font-medium text-primary">Registration successful.</span> Redirecting to terminal...';

                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 1500);
                    } else {
                        // Display backend errors (e.g., username already taken)
                        btn.disabled = false;
                        btn.innerHTML = originalText;
                        banner.classList.remove('hidden', 'bg-leaf-vibrant/10', 'text-primary');
                        banner.classList.add('bg-red-100', 'text-red-700', 'border', 'border-red-300');

                        // Format generic DRF validation errors for UI
                        let errorMsg = 'Failed to create account.';
                        if (data) {
                            const firstKey = Object.keys(data)[0];
                            if (data[firstKey] && Array.isArray(data[firstKey])) {
                                errorMsg = `${firstKey}: ${data[firstKey][0]}`;
                            }
                        }
                        banner.innerHTML = errorMsg;
                    }
                } catch (error) {
                    console.error('Registration Error:', error);
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    banner.classList.remove('hidden', 'bg-leaf-vibrant/10', 'text-primary');
                    banner.classList.add('bg-red-100', 'text-red-700', 'border', 'border-red-300');
                    banner.innerHTML = 'Unable to connect to the authentication server.';
                }
            }
        </script>
    </main>

</body>

</html>
